name: Deploy certification website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate generated website data
        run: python scripts/validate_site.py

      - name: Build minimal static site artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f logo.png
          test -f data/basic_information.json
          test -f data/certification_marks.json
          test -f data/reference_links.json
          test -f data/meta.json
          test -d assets/generated

          mkdir -p _site/data _site/assets
          cp index.html logo.png _site/
          cp -R data/. _site/data/
          cp -R assets/. _site/assets/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
